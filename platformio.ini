# CRITICAL: without default_envs, a plain "Upload" builds AND flashes EVERY
# environment in this file, so the [env:verify] diagnostic firmware would be
# written last and overwrite the artwork. The symptom is nasty: verify() returns
# from setup() and then loop() idles, so the OLED stays frozen on whatever
# disp::showMessage() was last drawn ("载入模型...") and it looks like a hang.
# Pin the default environment, and use -e verify explicitly when needed.
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]

platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_upload.flash_size = 16MB

# IMPORTANT: platform-espressif32 picks the prebuilt Arduino sdkconfig libs from
# tools/sdk/esp32s3/<memory_type>. With no "arduino.memory_type" key it falls
# back to "<flash_mode>_qspi" = qio_qspi (QSPI PSRAM), which is WRONG for an# N16R8 module (16MB QIO flash + 8MB OPI/Octal PSRAM, needs libesp_hw_support
# with OCT PSRAM). Must stay qio_opi.
board_build.arduino.memory_type = qio_opi

# custom partition table: nvs + otadata + app0 + app1 + model(9.25MB) + tok(1.7MB)
# NOTE: keep every comment in these files ASCII. PlatformIO and ESP-IDF read
# them with the system codepage (cp936 on zh-CN Windows), so UTF-8 Chinese
# comments raise UnicodeDecodeError and break the build.
board_build.partitions = partitions.csv

upload_protocol = esptool
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

build_flags =
    -I .
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

# SH1106 128x64 I2C (SCL=GPIO3, SDA=GPIO8)
lib_deps =
    olikraus/U8g2 @ ^2.36.3

# Regenerate include/prompts.h from the PROMPT_BLOCK at the top of src/main.cpp
# on every build, so editing the prompt there and pressing Upload is enough.
# The device has a decode-only tokenizer, so prompts must be tokenized on the PC.
extra_scripts = pre:tools/pio_prompts.py

# --- diagnostics build: dumps reference logits instead of running the artwork ---
#
# !! DO NOT flash this by accident. It leaves the device showing the last
# !! message drawn before runVerify(), which looks exactly like a hang.
#
# tools/verify_forward.py reproduces the same numbers from model_esp.bin in
# numpy, so a mismatch localises a layout/math bug on the device without needing
# a good model. Always pass the environment explicitly:
#     pio run -e verify -t upload
#     pio run -e esp32-s3-devkitc-1 -t upload      # to get the artwork back
[env:verify]
extends = env:esp32-s3-devkitc-1
build_flags =
    -I .
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DESPLLM_VERIFY